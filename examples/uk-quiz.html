<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>General Knowledge of the United Kingdom · The Standup Edition</title>
<style>
  :root {
    --paper:       #f1ead8;
    --paper-soft:  #ebe1c7;
    --paper-deep:  #dfd2b3;
    --ink:         #1c2436;
    --ink-soft:    #3d4865;
    --ink-faint:   #7a8198;
    --crimson:     #8b2027;
    --ochre:       #b8862a;
    --brick:       #a13e2e;
    --forest:      #2c5840;
    --forest-soft: rgba(44, 88, 64, 0.10);
    --rule: 1px solid var(--ink);
    --hair: 1px solid rgba(28, 36, 54, 0.32);
    --serif-display: "Didot", "Bodoni 72", "Hoefler Text", "Playfair Display", Georgia, serif;
    --serif-body:    "Baskerville", "Libre Baskerville", "Hoefler Text", "Times New Roman", Georgia, serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--serif-body);
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.14  0 0 0 0 0.21  0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-blend-mode: multiply;
  }

  .stage { position: relative; width: 100vw; height: 100vh; }
  .stage::before, .stage::after {
    content: ""; position: absolute;
    width: 22px; height: 22px;
    border: var(--hair);
    pointer-events: none;
  }
  .stage::before { top: 18px; left: 18px; border-right: none; border-bottom: none; }
  .stage::after  { bottom: 18px; right: 18px; border-left: none; border-top: none; }

  .view {
    position: absolute; inset: 0;
    padding: 5vh 7vw 4vh;
    display: none; flex-direction: column;
    animation: rise .35s cubic-bezier(.16,.84,.44,1);
  }
  .view.active { display: flex; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------------- Home ---------------- */
  .masthead {
    text-align: center;
    border-top: var(--rule);
    border-bottom: var(--rule);
    padding: 2vh 0 2.4vh;
    margin-bottom: 4vh;
    position: relative;
  }
  .masthead::before, .masthead::after {
    content: ""; position: absolute; left: 0; right: 0;
    border-top: var(--hair);
  }
  .masthead::before { top: 3px; }
  .masthead::after  { bottom: 3px; }
  .masthead-eyebrow {
    font-variant: small-caps;
    letter-spacing: 0.4em;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 1.2vh;
  }
  .masthead-title {
    font-family: var(--serif-display);
    font-weight: 400;
    font-size: clamp(38px, 5vw, 64px);
    line-height: 1;
    letter-spacing: -0.005em;
    margin: 0;
  }
  .masthead-title em { font-style: italic; color: var(--crimson); }
  .masthead-sub {
    font-style: italic;
    font-size: clamp(14px, 1.4vw, 18px);
    color: var(--ink-soft);
    margin-top: 1vh;
  }
  .masthead-tag {
    font-variant: small-caps;
    letter-spacing: 0.32em;
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-top: 1.4vh;
  }

  .grid {
    display: grid; gap: 22px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    flex: 1;
  }
  .tile {
    background: var(--paper-soft);
    border: var(--rule);
    padding: 22px 22px 18px;
    cursor: pointer;
    display: flex; flex-direction: column;
    position: relative;
    transition: transform .22s cubic-bezier(.16,.84,.44,1),
                background .22s ease, box-shadow .22s ease;
  }
  .tile::before {
    content: ""; position: absolute;
    left: 6px; top: 6px; right: 6px; bottom: 6px;
    border: var(--hair);
    pointer-events: none;
  }
  .tile:hover {
    transform: translate(-2px, -3px);
    background: var(--paper);
    box-shadow: 6px 8px 0 -1px var(--ink);
  }
  .tile-num {
    font-family: var(--serif-display);
    font-size: clamp(40px, 4.2vw, 60px);
    line-height: 0.9;
    color: var(--ink);
    font-style: italic;
  }
  .tile-divider {
    width: 36px; height: 1px;
    background: var(--ink);
    margin: 14px 0 12px;
  }
  .tile-topic {
    font-style: italic;
    font-size: clamp(15px, 1.35vw, 19px);
    flex: 1;
  }
  .tile-date {
    font-variant: small-caps;
    letter-spacing: 0.22em;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 14px;
  }

  .colophon {
    text-align: center;
    margin-top: 3vh;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-faint);
  }
  .colophon kbd {
    font-style: normal;
    font-variant: small-caps;
    letter-spacing: 0.12em;
    border: var(--hair);
    padding: 1px 6px;
    color: var(--ink);
    margin: 0 2px;
  }

  /* ---------------- Question / Answer ---------------- */
  .q-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    border-bottom: var(--rule);
    padding-bottom: 2vh;
    margin-bottom: 3vh;
    position: relative;
  }
  .q-header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    border-top: var(--hair);
  }
  .q-meta {
    font-variant: small-caps;
    letter-spacing: 0.32em;
    font-size: 12px;
    color: var(--ink-soft);
    padding-top: 6px;
  }
  .q-meta .num {
    color: var(--crimson);
    font-style: italic;
    font-variant: normal;
    letter-spacing: 0;
    margin-right: 10px;
    font-size: 16px;
  }

  .timer { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
  .timer svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .timer .outer { fill: none; stroke: var(--ink); stroke-width: 0.8; opacity: 0.55; }
  .timer .track { fill: none; stroke: var(--ink); stroke-width: 1; opacity: 0.3; }
  .timer .ticks line { stroke: var(--ink); stroke-width: 1; }
  .timer .arc {
    fill: none; stroke: var(--ink); stroke-width: 3;
    stroke-linecap: butt;
    transition: stroke .25s ease;
  }
  .timer .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif-display);
    font-size: 32px;
    font-style: italic;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1;
  }
  .timer.amber .arc { stroke: var(--ochre); }
  .timer.amber .num { color: var(--ochre); }
  .timer.red   .arc { stroke: var(--brick); }
  .timer.red   .num { color: var(--brick); }
  .timer.done { animation: tick-done 1.4s ease-in-out infinite; }
  @keyframes tick-done {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  .question {
    font-family: var(--serif-display);
    font-weight: 400;
    font-size: clamp(28px, 3.6vw, 52px);
    line-height: 1.15;
    letter-spacing: -0.008em;
    margin: 2vh 0 4vh;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 56px;
    row-gap: 4px;
    flex: 1;
    align-content: start;
  }
  .option {
    display: grid;
    grid-template-columns: 56px 1fr 28px;
    align-items: center;
    gap: 18px;
    padding: 16px 4px;
    border-bottom: var(--hair);
    font-size: clamp(17px, 1.55vw, 22px);
    transition: opacity .35s ease, color .35s ease, background .35s ease;
  }
  .option .letter {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: clamp(28px, 2.6vw, 36px);
    text-align: center;
    line-height: 1;
  }
  .option .mark {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 24px;
    text-align: center;
    opacity: 0;
    transition: opacity .35s ease .1s;
  }
  .option.correct {
    color: var(--forest);
    background: linear-gradient(to right, var(--forest-soft), transparent 70%);
  }
  .option.correct .letter { color: var(--forest); }
  .option.correct .mark   { opacity: 1; color: var(--forest); }
  .option.wrong {
    opacity: 0.30;
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--ink-soft);
  }

  .explanation {
    visibility: hidden;
    margin-top: 3vh;
    border-top: var(--rule);
    border-bottom: var(--rule);
    padding: 2.5vh 6vw;
    text-align: center;
    font-style: italic;
    font-size: clamp(15px, 1.45vw, 20px);
    line-height: 1.55;
    position: relative;
  }
  .explanation::before {
    content: "※";
    position: absolute; left: 50%; top: -14px;
    transform: translateX(-50%);
    background: var(--paper);
    padding: 0 14px;
    font-style: normal;
    color: var(--crimson);
    font-size: 18px;
    letter-spacing: 0.4em;
  }
  .view.answer .explanation { visibility: visible; animation: rise .4s ease; }

  .footer-strip {
    margin-top: 2.4vh;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 1.4vh;
    border-top: var(--hair);
    font-variant: small-caps;
    letter-spacing: 0.28em;
    font-size: 10.5px;
    color: var(--ink-faint);
  }
  .footer-strip kbd {
    font-variant: normal;
    letter-spacing: 0;
    border: var(--hair);
    padding: 1px 6px;
    color: var(--ink);
    margin: 0 2px;
    font-size: 11px;
  }
  .footer-strip .folio {
    font-style: italic;
    font-variant: normal;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  .home-fab {
    position: absolute; top: 22px; left: 56px;
    background: transparent;
    border: var(--hair);
    color: var(--ink-soft);
    padding: 5px 14px;
    font-family: var(--serif-body);
    font-variant: small-caps;
    letter-spacing: 0.28em;
    font-size: 10.5px;
    cursor: pointer;
    z-index: 2;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .home-fab:hover {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }

  @media (max-width: 900px) {
    .grid    { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
    .options { grid-template-columns: 1fr; column-gap: 0; }
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
const QUESTIONS = [
  {
    day: 1, date: "Tuesday, 26 May", iso: "2026-05-26", topic: "Voting rights",
    question: "In which year did men and women in the UK both get the right to vote at the age of 21?",
    options: ["1918", "1928", "1948", "1969"],
    answer: 1,
    explanation: "Equal Franchise Act 1928 — women aged 21+ got the vote on the same terms as men. 1918 only gave it to women aged 30+."
  },
  {
    day: 2, date: "Wednesday, 27 May", iso: "2026-05-27", topic: "Scottish history",
    question: "At which 1314 battle did Robert the Bruce defeat the English under Edward II?",
    options: ["Battle of Hastings", "Battle of Agincourt", "Battle of Bannockburn", "Battle of Culloden"],
    answer: 2,
    explanation: "Bannockburn (1314) secured Scottish independence. Hastings was 1066, Agincourt 1415, Culloden 1746."
  },
  {
    day: 3, date: "Thursday, 28 May", iso: "2026-05-28", topic: "Patron saints",
    question: "Whose saint's day is celebrated on 1 March?",
    options: ["St George", "St Andrew", "St David", "St Patrick"],
    answer: 2,
    explanation: "St David is the patron saint of Wales — 1 March. George (England) 23 Apr · Patrick (NI) 17 Mar · Andrew (Scotland) 30 Nov."
  },
  {
    day: 4, date: "Friday, 29 May", iso: "2026-05-29", topic: "Crown Dependencies",
    question: "Which of these is a Crown Dependency and is NOT part of the United Kingdom?",
    options: ["Northern Ireland", "The Isle of Man", "Wales", "Cornwall"],
    answer: 1,
    explanation: "The Isle of Man and the Channel Islands are Crown Dependencies — self-governing, not part of the UK or the EU."
  },
  {
    day: 5, date: "Monday, 1 June", iso: "2026-06-01", topic: "Legal Latin",
    question: "What does Habeas Corpus mean in UK law?",
    options: ["The right to remain silent", "The right to bear arms", "No one can be held prisoner unlawfully", "The right to legal representation"],
    answer: 2,
    explanation: "Habeas Corpus Act 1679 — no one can be held prisoner unlawfully. They must be brought before a court to justify the detention."
  },
  {
    day: 6, date: "Tuesday, 2 June", iso: "2026-06-02", topic: "First Prime Minister",
    question: "Who is generally considered the first Prime Minister of Great Britain?",
    options: ["William Pitt the Younger", "Sir Robert Walpole", "Benjamin Disraeli", "Winston Churchill"],
    answer: 1,
    explanation: "Sir Robert Walpole served from 1721 to 1742 — the longest-serving PM in UK history and traditionally regarded as the first."
  },
  {
    day: 7, date: "Wednesday, 3 June", iso: "2026-06-03", topic: "British writers",
    question: "Which British author was born in Bombay (now Mumbai) and wrote 'The Jungle Book'?",
    options: ["Charles Dickens", "Rudyard Kipling", "Thomas Hardy", "Sir Walter Scott"],
    answer: 1,
    explanation: "Rudyard Kipling (1865–1936) — born in Bombay, wrote 'The Jungle Book' and 'Kim'. First English-language Nobel laureate in literature (1907)."
  },
  {
    day: 8, date: "Thursday, 4 June", iso: "2026-06-04", topic: "Constitutional history",
    question: "The Bill of Rights of 1689 confirmed which key principle?",
    options: ["The monarch holds absolute power", "Parliament's authority over the monarchy", "The Pope's supremacy in England", "Equal voting rights for all adults"],
    answer: 1,
    explanation: "The Bill of Rights 1689 established that the monarch could not rule without Parliament's consent — a foundation of constitutional monarchy."
  },
];

const TIMER_SECONDS = 60;
const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
const toRoman = n => ROMAN[n - 1] || String(n);

const stage = document.getElementById("stage");
let state = { view: "home", qIdx: 0, mode: "question", timerId: null };

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

function render() {
  stage.innerHTML = "";
  stage.appendChild(state.view === "home" ? renderHome() : renderQuestion(state.qIdx, state.mode));
}

function renderHome() {
  const view = el("div", "view active");
  view.innerHTML = `
    <header class="masthead">
      <div class="masthead-eyebrow">From the Standup Edition · Mmxxvi</div>
      <h1 class="masthead-title">General Knowledge of <em>the United Kingdom</em></h1>
      <div class="masthead-sub">A small morning quiz</div>
      <div class="masthead-tag">Eight Days · Eight Questions · Sixty Seconds</div>
    </header>
    <div class="grid" id="grid"></div>
    <div class="colophon">
      Select a day below, or press <kbd>1</kbd>–<kbd>8</kbd> · arrow keys to navigate · <kbd>Esc</kbd> to return
    </div>
  `;
  const grid = view.querySelector("#grid");
  QUESTIONS.forEach((q, i) => {
    const tile = el("article", "tile");
    tile.innerHTML = `
      <div class="tile-num">${toRoman(q.day)}</div>
      <div class="tile-divider"></div>
      <div class="tile-topic">${q.topic}</div>
      <div class="tile-date">${q.date}, 2026</div>
    `;
    tile.addEventListener("click", () => goToQuestion(i));
    grid.appendChild(tile);
  });
  return view;
}

function renderQuestion(idx, mode) {
  const q = QUESTIONS[idx];
  const view = el("div", "view active " + mode);
  const letters = ["A", "B", "C", "D"];
  const footer = mode === "question"
    ? 'Click anywhere · <kbd>Space</kbd> or <kbd>→</kbd> to reveal'
    : '<kbd>←</kbd> question · <kbd>→</kbd> next day · <kbd>H</kbd> home';

  view.innerHTML = `
    <button class="home-fab" id="homeBtn">↩ Home</button>
    <div class="q-header">
      <div class="q-meta">
        <span class="num">№ ${toRoman(q.day)}</span>${q.date}, 2026 · ${q.topic}
      </div>
      <div class="timer" id="timer">
        <svg viewBox="0 0 100 100">
          <circle class="outer" cx="50" cy="50" r="46" />
          <g class="ticks">
            <line x1="50" y1="6"  x2="50" y2="12" />
            <line x1="94" y1="50" x2="88" y2="50" />
            <line x1="50" y1="94" x2="50" y2="88" />
            <line x1="6"  y1="50" x2="12" y2="50" />
          </g>
          <circle class="track" cx="50" cy="50" r="40" />
          <circle class="arc"   cx="50" cy="50" r="40" id="arc"
                  stroke-dasharray="251.33" stroke-dashoffset="0" />
        </svg>
        <div class="num" id="num">${TIMER_SECONDS}</div>
      </div>
    </div>
    <div class="question">${q.question}</div>
    <div class="options" id="options"></div>
    <div class="explanation">${q.explanation}</div>
    <div class="footer-strip">
      <span>${footer}</span>
      <span class="folio">Folio ${toRoman(q.day)} of VIII</span>
    </div>
  `;

  const optsBox = view.querySelector("#options");
  q.options.forEach((opt, i) => {
    const isAns = i === q.answer;
    let cls = "option";
    if (mode === "answer") cls += isAns ? " correct" : " wrong";
    const row = el("div", cls);
    row.innerHTML = `
      <div class="letter">${letters[i]}</div>
      <div class="label">${opt}</div>
      <div class="mark">${mode === "answer" && isAns ? "✓" : ""}</div>
    `;
    optsBox.appendChild(row);
  });

  view.querySelector("#homeBtn").addEventListener("click", e => {
    e.stopPropagation();
    goHome();
  });
  view.addEventListener("click", onSlideClick);

  if (mode === "question") startTimer(view);
  return view;
}

function startTimer(view) {
  clearTimer();
  const num  = view.querySelector("#num");
  const arc  = view.querySelector("#arc");
  const wrap = view.querySelector("#timer");
  const CIRC = 251.33; // 2 * π * 40
  let left = TIMER_SECONDS;
  const tick = () => {
    num.textContent = left;
    arc.setAttribute("stroke-dashoffset", CIRC * (1 - left / TIMER_SECONDS));
    wrap.classList.toggle("amber", left <= 20 && left > 10);
    wrap.classList.toggle("red",   left <= 10 && left > 0);
    if (left <= 0) {
      wrap.classList.add("done");
      clearTimer();
      return;
    }
    left -= 1;
  };
  tick();
  state.timerId = setInterval(tick, 1000);
}

function clearTimer() {
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
}

function onSlideClick(e) {
  if (e.target.closest("#homeBtn")) return;
  advance();
}

function advance() {
  if (state.view !== "question") return;
  if (state.mode === "question") {
    state.mode = "answer";
    clearTimer();
    render();
  } else {
    goHome();
  }
}

function back() {
  if (state.view !== "question") return;
  if (state.mode === "answer") { state.mode = "question"; render(); }
  else { goHome(); }
}

function nextDay() {
  if (state.view !== "question") { goHome(); return; }
  if (state.qIdx < QUESTIONS.length - 1) {
    state.qIdx += 1; state.mode = "question"; render();
  } else {
    goHome();
  }
}

function goToQuestion(i) {
  state.view = "question"; state.qIdx = i; state.mode = "question";
  render();
}

function goHome() {
  clearTimer();
  state.view = "home"; state.mode = "question";
  render();
}

document.addEventListener("keydown", e => {
  if (state.view === "home") {
    if (e.key >= "1" && e.key <= "8") goToQuestion(parseInt(e.key, 10) - 1);
    return;
  }
  switch (e.key) {
    case " ":
    case "Enter":
      e.preventDefault(); advance(); break;
    case "ArrowRight":
      if (state.mode === "answer") nextDay(); else advance(); break;
    case "ArrowLeft":
      back(); break;
    case "Escape":
    case "h":
    case "H":
      goHome(); break;
  }
});

render();
</script>
</body>
</html>
