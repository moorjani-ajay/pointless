packages:
  - shared
  - server
  - web
allowBuilds:
  esbuild: true
  # testcontainers' transitive Docker client ships optional native build
  # scripts we don't need — acknowledge-skip them so installs exit clean on CI
  # and the slim production image (which has no compiler).
  cpu-features: false
  protobufjs: false
  ssh2: false
auditConfig:
  ignoreGhsas:
    - GHSA-gv7w-rqvm-qjhr
