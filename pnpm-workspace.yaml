packages:
  - shared
  - server
  - web
overrides:
  # testcontainers (dev-only) pulls an older undici with high-severity DoS
  # advisories; force a patched release. Not shipped — devDependency only.
  undici: '^6.27.0'
allowBuilds:
  esbuild: true
  # testcontainers' transitive Docker client ships optional native build
  # scripts we don't need — acknowledge-skip them so installs stay clean on
  # CI and the slim production image (which has no compiler).
  cpu-features: false
  protobufjs: false
  ssh2: false
auditConfig:
  # esbuild dev-server CORS advisory — only affects local dev, not prod/CI.
  ignoreGhsas:
    - GHSA-gv7w-rqvm-qjhr
